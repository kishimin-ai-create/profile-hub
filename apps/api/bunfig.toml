[test]
# Enforce test file naming convention: *.small.test.ts / *.medium.test.ts / *.large.test.ts
# Plain *.test.ts or *.spec.ts files are intentionally excluded.
include = [
  "**/*.small.test.ts",
  "**/*.medium.test.ts",
  "**/*.large.test.ts",
  "**/*.small.test.tsx",
  "**/*.medium.test.tsx",
  "**/*.large.test.tsx",
]

coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Bun expects a fraction, and only honours the scalar form: the per-metric table
# is parsed without complaint and then ignored, so `{ line = 80, ... }` silently
# enforced nothing.
coverageThreshold = 0.8
# Without this the test files count as covered source, which inflates the figure
# the pull request report publishes and makes the threshold easier to clear the
# more tests are written.
coverageSkipTestFiles = true
