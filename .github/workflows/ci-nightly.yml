name: CI (Nightly)

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = JST 03:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  full-tests:
    name: All tests (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, public-web, admin-web]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        working-directory: apps/${{ matrix.workspace }}

      - name: Type check
        run: bun run typecheck
        working-directory: apps/${{ matrix.workspace }}

      - name: Run Small tests
        run: bun run test:small
        working-directory: apps/${{ matrix.workspace }}

      - name: Run Medium tests
        run: bun run test:medium
        working-directory: apps/${{ matrix.workspace }}

      - name: Run Large tests
        run: bun run test:large
        working-directory: apps/${{ matrix.workspace }}

      - name: Collect coverage
        run: bun run test:coverage
        working-directory: apps/${{ matrix.workspace }}

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-nightly-coverage
          path: apps/${{ matrix.workspace }}/coverage
          if-no-files-found: ignore
          retention-days: 30

  browser:
    name: Build, E2E and VRT (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: [public-web, admin-web]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit

      - name: Build application
        run: bun run build
        working-directory: apps/${{ matrix.workspace }}

      - name: Build Storybook
        run: bun run build-storybook
        working-directory: apps/${{ matrix.workspace }}

      - name: Run E2E tests
        run: |
          if [ -d e2e ]; then
            bun run e2e
          else
            echo "No e2e directory yet — skipping"
          fi
        working-directory: apps/${{ matrix.workspace }}

      - name: Capture VRT screenshots
        run: bun run vrt:capture
        working-directory: apps/${{ matrix.workspace }}

      - name: Compare VRT screenshots
        run: bun run vrt
        continue-on-error: true
        working-directory: apps/${{ matrix.workspace }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-playwright-report
          path: apps/${{ matrix.workspace }}/playwright-report
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload VRT diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-vrt-diff
          path: apps/${{ matrix.workspace }}/.reg
          if-no-files-found: ignore
          retention-days: 7
