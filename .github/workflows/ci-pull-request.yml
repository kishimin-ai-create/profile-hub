name: CI (Pull Request)

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ci-pull-request-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  static:
    name: Static checks (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: api
            markup: false
          - workspace: public-web
            markup: true
          - workspace: admin-web
            markup: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint
        working-directory: apps/${{ matrix.workspace }}

      - name: Type check
        run: bun run typecheck
        working-directory: apps/${{ matrix.workspace }}

      - name: Markup lint
        if: matrix.markup
        run: bun run lint:markup
        working-directory: apps/${{ matrix.workspace }}

  lint-rules:
    name: Custom ESLint rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The shared config is the only place these rules exist, so a regression
      # here silently weakens every application at once.
      - name: Run rule regression tests
        run: bun run test
        working-directory: packages/config

  tests:
    name: Test (${{ matrix.workspace }} / ${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, public-web, admin-web]
        size: [Small, Medium]
        # Only Vitest writes the JSON summary the report job parses. Bun's only
        # file reporter is JUnit, which that job cannot read, so the API has
        # nothing to upload and must not pretend otherwise.
        include:
          - workspace: api
            emits_test_report: false
          - workspace: public-web
            emits_test_report: true
          - workspace: admin-web
            emits_test_report: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.size }} tests
        run: bun run test:${{ matrix.size == 'Small' && 'small' || 'medium' }}
        working-directory: apps/${{ matrix.workspace }}

      # `error` rather than `ignore`: a summary that stops being written should
      # fail here instead of disappearing quietly from the report.
      - name: Upload test results
        if: ${{ !cancelled() && matrix.emits_test_report }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-${{ matrix.size }}-test-results
          path: apps/${{ matrix.workspace }}/test-result.json
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two runners take their threshold from different places, so the
        # script differs per workspace. Vitest only applies one when
        # COVERAGE_THRESHOLD is set, which is what `test:coverage:pr` does;
        # Bun reads it from bunfig.toml, so the API uses the plain script.
        # Calling `test:coverage` everywhere collects numbers and gates nothing.
        include:
          - workspace: api
            coverage_script: test:coverage
          - workspace: public-web
            coverage_script: test:coverage:pr
          - workspace: admin-web
            coverage_script: test:coverage:pr

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect coverage
        run: bun run ${{ matrix.coverage_script }}
        working-directory: apps/${{ matrix.workspace }}

      # `error` rather than `ignore`: coverage that stops being written should
      # fail here instead of quietly dropping a row from the report.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-coverage-report
          path: apps/${{ matrix.workspace }}/coverage
          if-no-files-found: error
          retention-days: 14

  report:
    name: CI report
    needs: [tests, coverage]
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-test-results"
          path: results

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-coverage-report"
          path: coverage

      - name: Build the report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const ratio = (covered, total) =>
              total === 0 ? "100% (0/0)" : `${Math.round((covered / total) * 1000) / 10}% (${covered}/${total})`;

            // Vitest writes a summary keyed by metric. Bun writes lcov, which
            // carries lines and functions but has no notion of a statement, and
            // emits no branch records at all — hence the gaps in the table.
            const readVitestCoverage = (directory) => {
              const file = path.join(directory, "coverage-summary.json");
              if (!fs.existsSync(file)) {
                return null;
              }
              const { total } = JSON.parse(fs.readFileSync(file, "utf8"));
              return {
                lines: ratio(total.lines.covered, total.lines.total),
                statements: ratio(total.statements.covered, total.statements.total),
                functions: ratio(total.functions.covered, total.functions.total),
                branches: ratio(total.branches.covered, total.branches.total),
              };
            };

            const readLcovCoverage = (directory) => {
              const file = path.join(directory, "lcov.info");
              if (!fs.existsSync(file)) {
                return null;
              }
              const sums = { LF: 0, LH: 0, FNF: 0, FNH: 0, BRF: 0, BRH: 0 };
              for (const line of fs.readFileSync(file, "utf8").split(/\r?\n/)) {
                const match = /^(LF|LH|FNF|FNH|BRF|BRH):(\d+)$/.exec(line.trim());
                if (match) {
                  sums[match[1]] += Number(match[2]);
                }
              }
              return {
                lines: ratio(sums.LH, sums.LF),
                statements: "—",
                functions: ratio(sums.FNH, sums.FNF),
                branches: sums.BRF === 0 ? "—" : ratio(sums.BRH, sums.BRF),
              };
            };

            const listDirectories = (root) =>
              fs.existsSync(root) ? fs.readdirSync(root).sort() : [];

            const testRows = [];
            for (const directory of listDirectories("results")) {
              const file = path.join("results", directory, "test-result.json");
              if (!fs.existsSync(file)) {
                continue;
              }
              const result = JSON.parse(fs.readFileSync(file, "utf8"));
              testRows.push(
                `| ${directory.replace(/-test-results$/, "")} | ${result.success ? "✅" : "❌"} | ` +
                  `${result.numTotalTestSuites} | ${result.numPassedTests} passed, ${result.numFailedTests} failed |`,
              );
            }

            const coverageRows = [];
            for (const directory of listDirectories("coverage")) {
              const full = path.join("coverage", directory);
              const summary = readVitestCoverage(full) ?? readLcovCoverage(full);
              if (!summary) {
                continue;
              }
              coverageRows.push(
                `| ${directory.replace(/-coverage-report$/, "")} | ${summary.lines} | ` +
                  `${summary.statements} | ${summary.functions} | ${summary.branches} |`,
              );
            }

            const runLink = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sections = ["# CI Report"];

            if (testRows.length > 0) {
              sections.push(
                [
                  "## Tests",
                  "",
                  "| Workspace / size | Result | Suites | Cases |",
                  "| --- | --- | --- | --- |",
                  ...testRows,
                  "",
                  "The API runs under Bun, which emits no summary this job can read; its results are in its own job log.",
                ].join("\n"),
              );
            } else {
              sections.push("## Tests\n\nNo workspace produced a test summary.");
            }

            if (coverageRows.length > 0) {
              sections.push(
                [
                  "## Coverage",
                  "",
                  "| Workspace | Lines | Statements | Functions | Branches |",
                  "| --- | --- | --- | --- | --- |",
                  ...coverageRows,
                  "",
                  "`—` means the runner does not report that metric, not that it is zero.",
                ].join("\n"),
              );
            } else {
              sections.push("## Coverage\n\nNo workspace produced a coverage report.");
            }

            sections.push(`[Full run](${runLink})`);
            fs.writeFileSync("ci-report.md", sections.join("\n\n"), "utf8");

      # One comment that updates in place, rather than a new one per run.
      - name: Post the report
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-report
          path: ci-report.md
