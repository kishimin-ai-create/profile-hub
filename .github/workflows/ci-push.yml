name: CI (Push)

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  verify:
    name: Verify (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, public-web, admin-web]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the package store rather than node_modules: Bun links workspaces
      # in isolated mode, so node_modules is a tree of links that does not
      # survive being archived and restored.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        working-directory: apps/${{ matrix.workspace }}

      - name: Type check
        run: bun run typecheck
        working-directory: apps/${{ matrix.workspace }}

      - name: Run Small tests
        run: bun run test:small
        working-directory: apps/${{ matrix.workspace }}

      - name: Summarise test results
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const file = `apps/${{ matrix.workspace }}/test-result.json`;
            if (!fs.existsSync(file)) {
              console.log(`No test-result.json for ${{ matrix.workspace }}.`);
              return;
            }

            const result = JSON.parse(fs.readFileSync(file, "utf8"));
            const body = [
              `# ${{ matrix.workspace }} Small tests`,
              `**${result.success ? "All tests passed" : "Some tests failed"}**`,
              "",
              `- Suites: ${result.numTotalTestSuites} (passed ${result.numPassedTestSuites}, failed ${result.numFailedTestSuites})`,
              `- Cases: ${result.numTotalTests} (passed ${result.numPassedTests}, failed ${result.numFailedTests})`,
            ].join("\n");

            await core.summary.addRaw(body).write();

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-small-test-results
          path: apps/${{ matrix.workspace }}/test-result.json
          if-no-files-found: ignore
          retention-days: 14
