name: PostgreSQL integration

on:
  pull_request:
    paths:
      - "apps/api/src/**"
      - "apps/api/drizzle/**"
      - ".github/workflows/postgres-integration.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL migrations and Medium tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: profile_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profile_hub_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/profile_hub_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/profile_hub_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
        working-directory: apps/api
      - name: Run Medium tests
        run: bun run test:medium
        working-directory: apps/api
